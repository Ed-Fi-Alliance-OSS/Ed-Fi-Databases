name: CodeQL Security Scan

on:
  pull_request:
      branches: [main, ODS-*]
  push:
      branches: [main, ODS-*]

permissions: read-all

env:
  CONFIGURATION: "Release"

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    
    permissions:
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a # v3.35.2
        with:
          languages: 'csharp'
      - name: Build
        shell: pwsh
        run: dotnet build --configuration ${{ env.CONFIGURATION }} ./src/EdFi.Db.Deploy.sln
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a # v3.35.2